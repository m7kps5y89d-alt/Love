<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Признание</title>
<style>
:root{--bg:#fff1f4;--fg:#3a1020;--card:#ffffff;--accent:#ff3b6b;--muted:#8a5a68;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#1d0a12;--fg:#ffe3ea;--card:#2b1019;--accent:#ff5c85;--muted:#c796a6}}
:root[data-theme="dark"]{--bg:#1d0a12;--fg:#ffe3ea;--card:#2b1019;--accent:#ff5c85;--muted:#c796a6}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;align-items:center;justify-content:center;overflow:hidden}
.card{background:var(--card);border-radius:24px;padding:28px 22px;width:min(92%,380px);text-align:center;box-shadow:0 10px 40px rgba(255,59,107,.18);position:relative;min-height:340px}
.heart{font-size:64px;animation:beat 1.2s infinite}
@keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.18)}}
h1{font-size:24px;margin:10px 0 8px}
p{color:var(--muted);font-size:16px;line-height:1.45;margin:0 0 22px}
.btns{display:flex;gap:12px;justify-content:center;align-items:center;min-height:56px}
button{font:inherit;font-size:17px;font-weight:600;border:0;border-radius:14px;padding:14px 26px;cursor:pointer}
#yes{background:var(--accent);color:#fff}
#no{background:transparent;color:var(--muted);border:1.5px solid var(--muted)}
#no.run{position:fixed}
.done{display:none}
.done.show{display:block}
.ask.hide{display:none}
.float{position:fixed;font-size:26px;pointer-events:none;animation:up 2.4s ease-out forwards}
@keyframes up{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(-70vh)}}
</style>
</head>
<body>
<div class="card">
  <div class="ask" id="ask">
    <div class="heart">💗</div>
    <h1 id="title">Слушай, есть разговор</h1>
    <p>Ты мне до хрена нравишься. Реально. Давай попробуем быть вместе?</p>
    <div class="btns">
      <button id="yes">Да 💕</button>
      <button id="no">Нет</button>
    </div>
  </div>
  <div class="done" id="done">
    <div class="heart">🥰</div>
    <h1>Ура, блин!</h1>
    <p>Я знал. Люблю тебя. Пиши мне скорее.</p>
  </div>
</div>
<script>
(function(){
  var tg = window.Telegram && window.Telegram.WebApp;
  try{ if(tg){ tg.ready(); tg.expand(); } }catch(e){}
  var yes = document.getElementById('yes'), no = document.getElementById('no');
  var lines = ['Не-не, промахнулся','Ты чё, серьёзно?','Ну пожалуйста 🥺','Кнопка «Да» левее','Не поймаешь!'];
  var n = 0;
  function dodge(e){
    if(e) e.preventDefault();
    no.classList.add('run');
    var w = window.innerWidth - no.offsetWidth - 16, h = window.innerHeight - no.offsetHeight - 16;
    no.style.left = Math.max(8, Math.random()*w) + 'px';
    no.style.top = Math.max(8, Math.random()*h) + 'px';
    no.textContent = lines[n++ % lines.length];
  }
  no.addEventListener('mouseenter', dodge);
  no.addEventListener('touchstart', dodge, {passive:false});
  no.addEventListener('click', dodge);
  yes.addEventListener('click', function(){
    document.getElementById('ask').classList.add('hide');
    document.getElementById('done').classList.add('show');
    for(var i=0;i<24;i++){
      var s = document.createElement('div');
      s.className = 'float';
      s.textContent = ['💖','💕','❤️','💘'][i%4];
      s.style.left = (Math.random()*95) + 'vw';
      s.style.top = (60 + Math.random()*35) + 'vh';
      s.style.animationDelay = (Math.random()*0.8) + 's';
      document.body.appendChild(s);
    }
    try{ if(tg){ tg.HapticFeedback.notificationOccurred('success'); } }catch(e){}
  });
})();
</script>
</body>
</html>
